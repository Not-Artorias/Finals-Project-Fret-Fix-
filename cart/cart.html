<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fret & Fix</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<!-- Navbar -->
<header>
    <nav class="navbar">
        <span class="icon search-btn" id="searchIcon">🔍</span>
        <a href="../Homepage/Homepage.html" class="logo-link">
            <img src="./Pictures/logo.png" alt="Fret & Fix Logo" class="logo">
        </a>
        <div class="nav-icons">
            <a href="../cart/cart.html" class="icon" style="text-decoration: none;">🛒</a>
            <span class="icon user-btn" id="userIcon">👤</span>
            <span class="icon menu-btn">☰</span>
        </div>
    </nav>
</header>

<!-- User Dropdown (Hidden by Default) -->
<div class="user-dropdown" id="userDropdown">
    <a href="../loginregister/login.html"><button class="login-btn">Login</button></a>
    <a href="../loginregister/register.html"><button class="register-btn">Register</button></a>
</div>

<!-- Search Dropdown -->
<div class="search-bar" id="searchBar">
    <input type="text" class="search-input" placeholder="Search">
    <i class="fas fa-search search-icon"></i>
    <button class="close-search" id="closeSearch">&times;</button>
</div>

<script src="script.js"></script>


<!-- Sidebar Menu -->
<div class="sidebar" id="sidebar">
    <span class="close-btn">&times;</span>
    <ul>
        <li><a href="..\Homepage\Homepage.html">Home</a></li>
        <li><a href="..\Guitar shop\shop.html">Shop</a></li>
        <li><a href="..\repair\repair.html">Repairs</a></li>
        <li><a href="..\setup\setup.html">Upgrade</a></li>
        <li><a href="..\Homepage\Homepage.html#about">About Us</a></li>
        <li><a href="..\Homepage\Homepage.html#contact">Contact</a></li>
        
    </ul>

    <!-- Social Media Section -->
    <div class="social-section">
        <h5>FOLLOW US</h5>
        <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
        <a href="#" class="social-icon"><i class="fab fa-facebook"></i></a>
        <a href="#" class="social-icon"><i class="fab fa-youtube"></i></a>
        <a href="#" class="social-icon"><i class="fas fa-music"></i></a>
    </div>
</div>

    </div>

    <!-- 🛒 Cart Section -->
    <section class="cart-container">
        <h2>Your Cart</h2>
        <div class="cart-items">
            <div class="cart-item">
                <input type="checkbox" class="item-checkbox" data-price="65000">
                <img src="Pictures/guitar1.png" alt="Guitar 1">
                <div class="cart-info">
                    <h3>Superstrat S-G37-MAX-S</h3>
                    <p class="price">₱65,000.00</p>
                    <div class="quantity">
                        <button class="minus">-</button>
                        <input type="number" value="1" min="1" class="quantity-input">
                        <button class="plus">+</button>
                    </div>
                </div>
                <button class="remove-btn">Remove</button>
            </div>

            <div class="cart-item">
                <input type="checkbox" class="item-checkbox" data-price="48000">
                <img src="Pictures/guitar2.png" alt="Guitar 2">
                <div class="cart-info">
                    <h3>Les Paul LP-400X</h3>
                    <p class="price">₱48,000.00</p>
                    <div class="quantity">
                        <button class="minus">-</button>
                        <input type="number" value="1" min="1" class="quantity-input">
                        <button class="plus">+</button>
                    </div>
                </div>
                <button class="remove-btn">Remove</button>
            </div>

            <div class="cart-item">
                <input type="checkbox" class="item-checkbox" data-price="35000">
                <img src="Pictures/guitar3.png" alt="Guitar 3">
                <div class="cart-info">
                    <h3>Classic Strat S-22</h3>
                    <p class="price">₱35,000.00</p>
                    <div class="quantity">
                        <button class="minus">-</button>
                        <input type="number" value="1" min="1" class="quantity-input">
                        <button class="plus">+</button>
                    </div>
                </div>
                <button class="remove-btn">Remove</button>
            </div>
        </div>

        <!-- Checkout Section -->
        <div class="cart-summary">
            <h3>Order Summary</h3>
            <div class="summary-details">
                <p>Subtotal: <span id="subtotal">₱0.00</span></p>
                <p>Shipping: <span id="shipping">₱0.00</span></p>
                <p class="total-label">Total: <strong id="total">₱0.00</strong></p>
            </div>

            <a href="../checkout/checkout.html">
                <button class="checkout-btn">Proceed to Checkout</button>
            </a>
        </div>
    </section>

</body>
</html>
